const FD=[["name","शाळेचे नाव"],["hm","मुख्याध्यापक"],["b","मुले"],["g","मुली"],["st","मान्य शिक्षक"],["wt","कार्यरत शिक्षक"],["gd","सुस्थित खोल्या"],["dg","धोकादायक खोल्या"],["rp","दुरुस्ती आव. खोल्या"],["am","दुरुस्ती रक्कम (₹)"],["nw","नवीन खोल्या आव."],["ra","रॅम्प"],["kt","किचन शेड स्थिती"],["wl","संरक्षण भिंत"],["gr","मैदान क्षेत्रफळ"],["sp","विशेष उपक्रम"],["rm","अभिप्राय"],["dt","भेट दिनांक"],["s1","शिष्यवृत्ती सहभाग"],["s2","शिष्यवृत्ती पात्र"]];

const MDX_ORD=["savedAt","classGroup","school","udise","reportMonth","reportYear","pat","prevRice","receivedRice","totalRice","workingDays","beneficiaries","cookedRice","balanceRice","totalExpense"];
let MDX={rows:null,err:"",busy:false};
function mdxParse(d){const head=(d.head||[]).map(h=>String(h).trim()),named=MDX_ORD.every(k=>head.includes(k)||k==="savedAt"||k==="school")&&head.includes("udise");
 const ix=k=>named?head.indexOf(k):MDX_ORD.indexOf(k),m=new Map();
 (d.rows||[]).forEach(r=>{const g=k=>{const i=ix(k);return i<0?"":(r[i]??"")},o={};MDX_ORD.forEach(k=>o[k]=g(k));if(!String(o.udise).trim())return;m.set([String(o.udise).trim(),o.classGroup,o.reportMonth,String(o.reportYear)].join("|"),o)});
 return [...m.values()]}
async function mdxFill(u,force){const box=$("mdxbox");if(!box)return;
 if(MDX.rows&&!force){box.innerHTML=mdxHtml(u);return}
 if(MDX.busy)return;MDX.busy=true;box.innerHTML='<p class="note">लोड होत आहे…</p>';
 try{const r=await fetch(MDM_SHEET_URL+"?action=list&t="+Date.now());const d=await r.json();MDX.rows=mdxParse(d);MDX.err=""}catch(e){MDX.err="माहिती मिळवता आली नाही – इंटरनेट / Apps Script deployment तपासा"}
 MDX.busy=false;const b=$("mdxbox");if(b)b.innerHTML=mdxHtml(cur||u)}
function mdxRows(u){return (MDX.rows||[]).filter(o=>String(o.udise).trim()===String(u)).sort((a,b)=>(+a.reportYear-+b.reportYear)||(MMN.indexOf(a.reportMonth)-MMN.indexOf(b.reportMonth))||String(a.classGroup).localeCompare(String(b.classGroup)))}
function mdxHtml(u){if(MDX.err)return '<p class="note" style="color:var(--wr)">'+E(MDX.err)+'</p>';
 const L=(MDX.rows||[]).filter(o=>String(o.udise).trim()===String(u)).sort((a,b)=>(+b.reportYear-+a.reportYear)||(MMN.indexOf(b.reportMonth)-MMN.indexOf(a.reportMonth))||String(a.classGroup).localeCompare(String(b.classGroup)));
 if(!L.length)return '<p class="note">या शाळेची MDM फॉर्म वरून अजून नोंद नाही.</p>';
 const f=v=>v===""||v==null?"—":n(v);
 return '<div class="ovx"><table class="mini" style="min-width:900px"><thead><tr><th>महिना</th><th>गट</th><th>पट</th><th>कार्यदिवस</th><th>लाभार्थी</th><th>मागील शिल्लक</th><th>प्राप्त</th><th>एकूण तांदूळ</th><th>शिजवलेला</th><th>शिल्लक</th><th>खर्च ₹</th></tr></thead><tbody>'+L.map(o=>`<tr><td>${E(o.reportMonth)} ${n(o.reportYear)}</td><td>${E(o.classGroup)}</td><td>${f(o.pat)}</td><td>${f(o.workingDays)}</td><td>${f(o.beneficiaries)}</td><td>${f(o.prevRice)}</td><td>${f(o.receivedRice)}</td><td>${f(o.totalRice)}</td><td>${f(o.cookedRice)}</td><td>${f(o.balanceRice)}</td><td>${f(o.totalExpense)}</td></tr>`).join("")+'</tbody></table></div><p class="note">ही यादी फक्त वाचनासाठी आहे (mdm-ravivar-peth फॉर्म मधून). एकाच महिना + गटासाठी शेवटची नोंद दाखवली जाते.</p>'}

/* ===== A4 landscape print: all schools' MDM form data, by class group / month / year ===== */
async function mdxLoad(force){if(MDX.rows&&!force)return true;try{const r=await fetch(MDM_SHEET_URL+"?action=list&t="+Date.now());MDX.rows=mdxParse(await r.json());MDX.err="";return true}catch(e){MDX.err="x";return false}}
function mdxPrintDlg(){if($("mdxdlg"))return;const d=document.createElement("div");d.id="mdxdlg";d.className="np";
 d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px";
 const yr=new Date().getFullYear(),op=a=>a.map(x=>`<option>${x}</option>`).join("");
 d.innerHTML=`<div style="background:var(--cd);color:var(--ink);border-radius:var(--r);padding:16px;width:100%;max-width:380px;box-shadow:var(--sh)"><h3 style="margin:0 0 10px">🍚 MDM मासिक प्रिंट (A4 आडवा)</h3>
 <div class="fl" style="display:grid;gap:10px"><div><label>इयत्ता गट</label><select id="pxg"><option>इ. 1 ते 5</option><option>इ. 6 ते 8</option><option>दोन्ही गट (वेगळ्या पानावर)</option></select></div>
 <div><label>महिना</label><select id="pxm">${op(MMN)}</select></div><div><label>वर्ष</label><input id="pxy" type="number" inputmode="numeric" value="${yr}"></div></div>
 <p class="note" id="pxs"></p><div style="display:flex;gap:8px;margin-top:10px"><button class="b p" id="pxgo" style="flex:1">प्रिंट / PDF</button><button class="b" id="pxx">रद्द</button></div></div>`;
 document.body.appendChild(d);$("pxm").selectedIndex=Math.max(0,new Date().getMonth()-1);
 $("pxx").onclick=()=>d.remove();d.addEventListener("click",e=>{if(e.target===d)d.remove()});
 $("pxgo").onclick=async()=>{const b=$("pxgo");b.disabled=true;$("pxs").textContent="माहिती लोड होत आहे…";
  const ok=await mdxLoad(true);b.disabled=false;if(!ok){$("pxs").textContent="माहिती मिळवता आली नाही – इंटरनेट तपासा";return}
  const g=$("pxg").value,m=$("pxm").value,y=$("pxy").value;d.remove();mdxPrint(g.indexOf("दोन्ही")===0?MMG:[g],m,y)}}
function mdxPrint(groups,m,y){PB=false;const R=MDX.rows||[],f3=v=>n(mmF3(+v||0)),f2=v=>n(mmF2(+v||0));let h="";
 groups.forEach((g,gi)=>{let t=[0,0,0,0,0,0,0,0],c=0,sr=0;const up=g.indexOf("6")>=0;
  const rows=S.map((s,i)=>{const o=R.find(r=>String(r.udise).trim()===String(s.u)&&r.classGroup===g&&r.reportMonth===m&&String(r.reportYear)===String(y));
   if(!o)return up?null:[n(i+1),s.name,s.u,"—","—","—","—","—","—","—","—","—"];
   c++;const cc=mmCalc({g,ben:o.beneficiaries,prev:o.prevRice,recv:o.receivedRice}),v=[+o.pat||0,+o.workingDays||0,+o.beneficiaries||0,+o.prevRice||0,+o.receivedRice||0,+(o.totalRice===""?cc.tot:o.totalRice)||0,+(o.cookedRice===""?cc.ck:o.cookedRice)||0,+(o.balanceRice===""?cc.bal:o.balanceRice)||0,+(o.totalExpense===""?cc.ex:o.totalExpense)||0];
   t[0]+=v[0];t[1]+=v[2];t[2]+=v[3];t[3]+=v[4];t[4]+=v[5];t[5]+=v[6];t[6]+=v[7];t[7]+=v[8];
   return [n(up?++sr:i+1),s.name,s.u,n(v[0]),n(v[1]),n(v[2]),f3(v[3]),f3(v[4]),f3(v[5]),f3(v[6]),f3(v[7]),f2(v[8])]});
  rows.splice(0,rows.length,...rows.filter(Boolean));
  rows.push(["","एकूण","",n(t[0]),"",n(t[1]),f3(t[2]),f3(t[3]),f3(t[4]),f3(t[5]),f3(t[6]),f2(t[7])]);
  h+=(gi?'<div style="break-before:page"></div>':"")+pHead("केंद्र रविवार पेठ – शालेय पोषण आहार मासिक अहवाल",g+" • "+m+" "+n(y),"ता. अंबाजोगाई • जि. बीड • नोंद आलेल्या शाळा: "+n(c)+(up?"":" / "+n(S.length)))+`<div class="pen psum">`+pT(["अ.क्र.","शाळेचे नाव","U-DISE","पट","कार्यदिवस","लाभार्थी","मागील शिल्लक (किग्रॅ)","प्राप्त (किग्रॅ)","एकूण तांदूळ","शिजवलेला","शिल्लक","खर्च ₹"],rows)+`</div>`+pSig(["केंद्रप्रमुख","रुपेश पांडुरंग लोंढे"],["गट शिक्षणाधिकारी / अधिकारी",""])});
 pDoc("MDM मासिक अहवाल – "+m+" "+y,h,true)}
function mmLive(){const v=i=>$(i)?$(i).value:"";if(!$("mmtot"))return;const e={g:v("mmg"),ben:v("mmben"),prev:v("mmprev"),recv:v("mmrecv")},c=mmCalc(e),has=v("mmprev")!==""||v("mmrecv")!=="";
 $("mmtot").value=has?n(c.tot):"";$("mmck").value=e.ben!==""&&e.g?n(c.ck):"";$("mmbal").value=(has||e.ben!=="")&&e.g?n(c.bal):(has?n(c.bal):"");$("mmex").value=e.ben!==""&&e.g?n(c.ex):""}
function mmAdd(u){const v=i=>$(i).value.trim(),g=v("mmg"),m=v("mmm"),y=v("mmy");
 if(!g||!m||!y||["mmpat","mmdays","mmben","mmprev","mmrecv"].some(i=>v(i)==="")){toast("सर्व आवश्यक (*) रकाने भरा");return false}
 if(+v("mmdays")>31||["mmpat","mmdays","mmben","mmprev","mmrecv"].some(i=>+v(i)<0)){toast("कार्यदिवस 31 पेक्षा जास्त किंवा ऋण संख्या चालणार नाही");return false}
 const e={g,m,y,pat:v("mmpat"),days:v("mmdays"),ben:v("mmben"),prev:v("mmprev"),recv:v("mmrecv")};
 u.mm=u.mm||[];const i=u.mm.findIndex(z=>z.g===g&&z.m===m&&String(z.y)===String(y));
 if(i>=0){if(!confirm("या इयत्ता गटाची व महिन्याची नोंद आधीच आहे. बदलायची का?"))return false;u.mm[i]=e}else u.mm.push(e);
 toast("पोषण आहार नोंद जतन केली");return true}
["input","change"].forEach(ev=>$("app").addEventListener(ev,e=>{if(e.target.id&&e.target.id.indexOf("mm")===0)mmLive()}));

boot();

</script><script>
/* Show full text: single-line text boxes become wrapping, auto-growing fields */
(function(){const app=document.getElementById("app");if(!app)return;
const grow=t=>{t.style.height="auto";const h=t.scrollHeight;if(h>0)t.style.height=(h+2)+"px"};
function conv(){app.querySelectorAll('input:not([type]),input[type="text"]').forEach(i=>{if(i.id==="q"||i.readOnly)return;const t=document.createElement("textarea");[...i.attributes].forEach(a=>{if(a.name!=="type"&&a.name!=="value")t.setAttribute(a.name,a.value)});t.className=((i.className||"")+" ag").trim();t.rows=1;t.value=i.value;i.replaceWith(t)});app.querySelectorAll("textarea").forEach(grow)}
new MutationObserver(conv).observe(app,{childList:true,subtree:true});
app.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA")grow(e.target)});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("ag"))e.preventDefault()});
app.addEventListener("toggle",e=>{if(e.target.querySelectorAll)e.target.querySelectorAll("textarea").forEach(grow)},true);
addEventListener("resize",()=>app.querySelectorAll("textarea").forEach(grow));conv()})();
</script>
